version: '3'

tasks:
  build:
    sources:
      - input.txt
    generates:
      - output.txt
    cache:
      # CACHE_DIR is set by the test harness.
      # TASK_CACHE_HASH is injected automatically by the task runner.
      url: echo "file://$CACHE_DIR/build-$TASK_CACHE_HASH.zip"
    cmds:
      - cp input.txt output.txt
